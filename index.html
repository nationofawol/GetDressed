<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>g's closet</title>
  <link rel="icon" type="image/x-icon" href="head.png">    
  <! -- version 1 -- !>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Josefin Sans', sans-serif;
  background: #b7008c;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.home-container {
  max-width: 400px;
  text-align: center;
}

h1 {
  color: white;
  font-weight: 600;
  margin-bottom: 10px;
}

.subtitle {
  color: #ffc399;
  margin-bottom: 30px;
}

.nav-buttons {
  display: flex;
  flex-direction: column;
  gap: 30px;
}

.nav-btn {
  display: block;
  padding: 15px;
  background: #fe8e3d;
  color: white;
  text-decoration: none;
  border-radius: 8px;
  font-size: 18px;
  transition: 0.2s;
}

.nav-btn:hover {
  background: #ff7a1a;
}
/* Dropdown container */
.dropdown {
  position: relative;
}


.fixed-side-image {
  position: fixed;
  left: 20px;
  top: 75px;
  width: 500px;
  z-index: 1000;
}

/* Hide dropdown by default */
.dropdown-content {
  display: none;
  position: absolute;
  top: 50px;
  left: 0;
  background: #fe8e3d;
  border-radius: 8px;
  width: 100%;
  overflow: hidden;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

/* Dropdown links */
.dropdown-content a {
  display: block;
  padding: 12px;
  color: white;
  text-decoration: none;
  font-size: 16px;
}

.dropdown-content a:hover {
  background: #ff7a1a;
}

/* Show dropdown on hover */
.dropdown:hover .dropdown-content {
  display: block;
}

/* Make the main button look clickable */
.dropdown > .nav-btn {
  cursor: pointer;
}

</style>

</head>
<body>
<img src="finalpixel.png" class="fixed-side-image">
  <div class="home-container">
    <h1>g's closet</h1>
    <p class="subtitle">"Pick something!"</p>
<div class="nav-buttons">
      <a href="closet.html" class="nav-btn">Explore Closet</a>
      <a href="store.html" class="nav-btn">Add an Item!</a>
    </div>
  </div>

</body>
</html>
