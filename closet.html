<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Today's Closet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Josefin Sans', sans-serif;
      background: #b7008c;
      color: #ffffff;
      margin: 0;
      padding: 30px;
    }

    h1 {
      text-align: center;
      font-size: 40px;
      margin-bottom: 10px;
    }

    .top-nav {
      width: 100%;
      text-align: center;
      margin-bottom: 20px;
    }

    .nav-btn {
      background: #fe8e3d;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }

    .nav-btn:hover { background: #e6762d; }

    .closet-container {
      position: relative;
      max-width: 450px;
      height: 640px;
      margin: 30px auto;
    }

    .pair-stack {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      height: 100%;
      transition: opacity 0.25s ease;
    }

    .hanger {
      color: #b7008c;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 15px;
      flex: 1;
    }

    .hanger img {
      max-width: 100%;
      max-height: 75%;
      object-fit: contain;
      border-radius: 8px;
    }

    .hanger .label {
      margin-top: 10px;
      font-weight: 600;
      font-size: 18px;
      text-align: center;
    }

    .hanger .empty-msg {
      color: #ccc;
      font-style: italic;
    }

    #dressHanger {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      transition: opacity 0.25s ease, z-index 0s;
    }

    .dress-hanger {
      background: none;
      box-shadow: none;
    }

    .layer-back {
      z-index: 1;
      opacity: 0;
      pointer-events: none;
    }

    .layer-front {
      z-index: 2;
      opacity: 1;
      pointer-events: auto;
    }

    .controls-wrapper {
      max-width: 450px;
      margin: 0 auto;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 8px 12px;
    }

    .control-row button {
      background: #fe8e3d;
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .control-row button:hover { background: #e6762d; }

    .laundry-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: #ffffff;
      cursor: pointer;
      user-select: none;
    }

    .laundry-toggle input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #fe8e3d;
    }

    #statusLine {
      margin-top: 12px;
      font-size: 14px;
      color: #ffe0f5;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="top-nav">
    <a href="index.html" class="nav-btn">Home!</a>
  </div>

  <h1>Today's Closet</h1>

  <div class="closet-container">
    <div class="pair-stack layer-front" id="pairStack">
      <div class="hanger" id="topHanger">
        <div class="empty-msg">No top yet</div>
      </div>
      <div class="hanger" id="bottomHanger">
        <div class="empty-msg">No bottom yet</div>
      </div>
    </div>

    <div class="hanger dress-hanger layer-back" id="dressHanger">
      <div class="empty-msg">No dress yet</div>
    </div>
  </div>

  <div class="controls-wrapper">

    <div class="control-row">
      <button id="topBackBtn">← Back Top</button>
      <label class="laundry-toggle">
        <input type="checkbox" id="topLaundryCheck"> Laundry
      </label>
      <button id="topNextBtn">Top Next →</button>
    </div>

    <div class="control-row">
      <button id="bottomBackBtn">← Back Bottom</button>
      <label class="laundry-toggle">
        <input type="checkbox" id="bottomLaundryCheck"> Laundry
      </label>
      <button id="bottomNextBtn">Bottom Next →</button>
    </div>

    <div class="control-row">
      <button id="dressBackBtn">← Back Dress</button>
      <label class="laundry-toggle">
        <input type="checkbox" id="dressLaundryCheck"> Laundry
      </label>
      <button id="dressNextBtn">Dress Next →</button>
    </div>

    <div id="statusLine"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getFirestore, collection, getDocs, query, doc, updateDoc
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCdKB6yoYhJpN2cdSj29v_IKiYet88jOaY",
        authDomain: "gs-closet.firebaseapp.com",
        projectId: "gs-closet",
        storageBucket: "gs-closet.firebasestorage.app",
        messagingSenderId: "851094693820",
        appId: "1:851094693820:web:c33a7f98acbee0302fedb9",
        measurementId: "G-SE8P9F671F"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Only clean items live in these arrays — laundry items are filtered out on load
    // and spliced out immediately when marked.
    let tops = [];
    let bottoms = [];
    let dresses = [];

    let topIndex = -1;
    let bottomIndex = -1;
    let dressIndex = -1;

    const topHanger = document.getElementById("topHanger");
    const bottomHanger = document.getElementById("bottomHanger");
    const dressHanger = document.getElementById("dressHanger");
    const pairStack = document.getElementById("pairStack");
    const statusLine = document.getElementById("statusLine");

    const topLaundryCheck = document.getElementById("topLaundryCheck");
    const bottomLaundryCheck = document.getElementById("bottomLaundryCheck");
    const dressLaundryCheck = document.getElementById("dressLaundryCheck");

    async function loadItems() {
      try {
        const q = query(collection(db, "items"));
        const snapshot = await getDocs(q);
        snapshot.forEach(d => {
          const data = { id: d.id, ...d.data() };
          if (typeof data.laundry !== "boolean") data.laundry = false;

          // Skip anything already marked as laundry
          if (data.laundry === true) return;

          if (data.type === "Top") tops.push(data);
          else if (data.type === "Bottom") bottoms.push(data);
          else if (data.type === "Dress") dresses.push(data);
        });

        if (tops.length > 0) { topIndex = 0; renderTop(); }
        if (bottoms.length > 0) { bottomIndex = 0; renderBottom(); }
        if (dresses.length > 0) { dressIndex = 0; }

        statusLine.textContent =
          `${tops.length} clean tops, ${bottoms.length} clean bottoms, ${dresses.length} clean dresses`;
      } catch (err) {
        console.error("Failed to load items:", err);
        statusLine.textContent = "Couldn't load items — check console.";
      }
    }

    function fillHanger(el, item) {
      el.innerHTML = "";

      if (!item) {
        const msg = document.createElement("div");
        msg.className = "empty-msg";
        msg.textContent = "Nothing clean here!";
        el.appendChild(msg);
        return;
      }

      const thumb = item?.photos?.[0];
      if (thumb) {
        const img = document.createElement("img");
        img.src = thumb;
        el.appendChild(img);
      }

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = item?.title || "Untitled";
      el.appendChild(label);
    }

    function showPair() {
      pairStack.classList.remove("layer-back");
      pairStack.classList.add("layer-front");
      dressHanger.classList.remove("layer-front");
      dressHanger.classList.add("layer-back");
    }

    function showDress() {
      dressHanger.classList.remove("layer-back");
      dressHanger.classList.add("layer-front");
      pairStack.classList.remove("layer-front");
      pairStack.classList.add("layer-back");
    }

    async function markAsLaundry(item) {
      if (!item) return;
      try {
        await updateDoc(doc(db, "items", item.id), { laundry: true });
      } catch (err) {
        console.error("Failed to update laundry status:", err);
        statusLine.textContent = "Couldn't update laundry status — check console.";
      }
    }

    // ---- TOP ----
    function renderTop() {
      const item = tops[topIndex] || null;
      fillHanger(topHanger, item);
      topLaundryCheck.checked = false;
      statusLine.textContent = tops.length
        ? `Top ${topIndex + 1}/${tops.length}`
        : "No clean tops.";
      showPair();
    }

    document.getElementById("topNextBtn").addEventListener("click", () => {
      if (tops.length === 0) { statusLine.textContent = "No clean tops."; return; }
      topIndex = (topIndex + 1) % tops.length;
      renderTop();
    });

    document.getElementById("topBackBtn").addEventListener("click", () => {
      if (tops.length === 0) { statusLine.textContent = "No clean tops."; return; }
      topIndex = (topIndex - 1 + tops.length) % tops.length;
      renderTop();
    });

    topLaundryCheck.addEventListener("change", async () => {
      if (!topLaundryCheck.checked || topIndex < 0 || tops.length === 0) return;
      const item = tops[topIndex];
      await markAsLaundry(item);
      tops.splice(topIndex, 1);
      if (topIndex >= tops.length) topIndex = tops.length - 1; // clamp
      renderTop();
    });

    // ---- BOTTOM ----
    function renderBottom() {
      const item = bottoms[bottomIndex] || null;
      fillHanger(bottomHanger, item);
      bottomLaundryCheck.checked = false;
      statusLine.textContent = bottoms.length
        ? `Bottom ${bottomIndex + 1}/${bottoms.length}`
        : "No clean bottoms.";
      showPair();
    }

    document.getElementById("bottomNextBtn").addEventListener("click", () => {
      if (bottoms.length === 0) { statusLine.textContent = "No clean bottoms."; return; }
      bottomIndex = (bottomIndex + 1) % bottoms.length;
      renderBottom();
    });

    document.getElementById("bottomBackBtn").addEventListener("click", () => {
      if (bottoms.length === 0) { statusLine.textContent = "No clean bottoms."; return; }
      bottomIndex = (bottomIndex - 1 + bottoms.length) % bottoms.length;
      renderBottom();
    });

    bottomLaundryCheck.addEventListener("change", async () => {
      if (!bottomLaundryCheck.checked || bottomIndex < 0 || bottoms.length === 0) return;
      const item = bottoms[bottomIndex];
      await markAsLaundry(item);
      bottoms.splice(bottomIndex, 1);
      if (bottomIndex >= bottoms.length) bottomIndex = bottoms.length - 1;
      renderBottom();
    });

    // ---- DRESS ----
    function renderDress() {
      const item = dresses[dressIndex] || null;
      fillHanger(dressHanger, item);
      dressLaundryCheck.checked = false;
      statusLine.textContent = dresses.length
        ? `Dress ${dressIndex + 1}/${dresses.length}`
        : "No clean dresses.";
      showDress();
    }

    document.getElementById("dressNextBtn").addEventListener("click", () => {
      if (dresses.length === 0) { statusLine.textContent = "No clean dresses."; return; }
      dressIndex = (dressIndex + 1) % dresses.length;
      renderDress();
    });

    document.getElementById("dressBackBtn").addEventListener("click", () => {
      if (dresses.length === 0) { statusLine.textContent = "No clean dresses."; return; }
      dressIndex = (dressIndex - 1 + dresses.length) % dresses.length;
      renderDress();
    });

    dressLaundryCheck.addEventListener("change", async () => {
      if (!dressLaundryCheck.checked || dressIndex < 0 || dresses.length === 0) return;
      const item = dresses[dressIndex];
      await markAsLaundry(item);
      dresses.splice(dressIndex, 1);
      if (dressIndex >= dresses.length) dressIndex = dresses.length - 1;
      renderDress();
    });

    loadItems();
  </script>

</body>
</html>
