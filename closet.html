<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Today's Closet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Josefin Sans', sans-serif;
      background: #b7008c;
      color: #ffffff;
      margin: 0;
      padding: 30px;
    }

    h1 {
      text-align: center;
      font-size: 40px;
      margin-bottom: 10px;
    }

    .top-nav {
      width: 100%;
      text-align: center;
      margin-bottom: 20px;
    }

    .nav-btn {
      background: #fe8e3d;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }

    .nav-btn:hover {
      background: #e6762d;
    }

    /* Stack: top+bottom column, and dress absolutely overlaid on top */
    .closet-container {
      position: relative;
      max-width: 450px;
      height: 640px;
      margin: 30px auto;
      
    }

    .pair-stack {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      height: 100%;
      transition: opacity 0.25s ease;
    }

    .hanger {
      background: white;
      color: #b7008c;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 15px;
      flex: 1;
    }

    .hanger img {
      max-width: 100%;
      max-height: 75%;
      object-fit: contain;
      border-radius: 8px;
    }

    .hanger .label {
      margin-top: 10px;
      font-weight: 600;
      font-size: 18px;
      text-align: center;
    }

    .hanger .empty-msg {
      color: #ccc;
      font-style: italic;
    }

    #dressHanger {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      transition: opacity 0.25s ease, z-index 0s;
    }

    /* Whichever layer is "active" sits on top and is fully opaque;
       the other fades down and behind. */
    .layer-back {
      z-index: 1;
      opacity: 0;
      pointer-events: none;
    }

    .layer-front {
      z-index: 2;
      opacity: 1;
      pointer-events: auto;
    }

    .controls {
      text-align: center;
      margin-top: 10px;
    }

    .controls button {
      background: #fe8e3d;
      color: white;
      border: none;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
      margin: 0 8px;
    }

    .controls button:hover {
      background: #e6762d;
    }

    #statusLine {
      margin-top: 10px;
      font-size: 14px;
      color: #ffe0f5;
    }
  </style>
</head>
<body>

  <div class="top-nav">
    <a href="index.html" class="nav-btn">Home!</a>
  </div>

  <h1>Today's Closet</h1>

  <div class="closet-container">
    <div class="pair-stack layer-front" id="pairStack">
      <div class="hanger" id="topHanger">
        <div class="empty-msg">No top yet</div>
      </div>
      <div class="hanger" id="bottomHanger">
        <div class="empty-msg">No bottom yet</div>
      </div>
    </div>

    <div class="hanger layer-back" id="dressHanger">
      <div class="empty-msg">No dress yet</div>
    </div>
  </div>

  <div class="controls">
    <button id="topBtn">Next Top</button>
    <button id="bottomBtn">Next Bottom</button>
    <button id="dressBtn">Next Dress</button>
    <div id="statusLine"></div>
  </div>

  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore, collection, getDocs, query
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
      apiKey: "AIzaSyCdKB6yoYhJpN2cdSj29v_IKiYet88jOaY",
      authDomain: "gs-closet.firebaseapp.com",
      projectId: "gs-closet",
      storageBucket: "gs-closet.firebasestorage.app",
      messagingSenderId: "851094693820",
      appId: "1:851094693820:web:c33a7f98acbee0302fedb9",
      measurementId: "G-SE8P9F671F"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let tops = [];
  let bottoms = [];
  let dresses = [];

  let topIndex = -1;
  let bottomIndex = -1;
  let dressIndex = -1;

  const topHanger = document.getElementById("topHanger");
  const bottomHanger = document.getElementById("bottomHanger");
  const dressHanger = document.getElementById("dressHanger");
  const pairStack = document.getElementById("pairStack");
  const statusLine = document.getElementById("statusLine");

  async function loadItems() {
    try {
      const q = query(collection(db, "items"));
      const snapshot = await getDocs(q);
      snapshot.forEach(doc => {
        const data = { id: doc.id, ...doc.data() };
        if (data.type === "Top") tops.push(data);
        else if (data.type === "Bottom") bottoms.push(data);
        else if (data.type === "Dress") dresses.push(data);
      });
      statusLine.textContent =
        `${tops.length} tops, ${bottoms.length} bottoms, ${dresses.length} dresses loaded`;
    } catch (err) {
      console.error("Failed to load items:", err);
      statusLine.textContent = "Couldn't load items — check console.";
    }
  }

  function fillHanger(el, item) {
    el.innerHTML = "";
    const thumb = item?.photos?.[0];

    if (thumb) {
      const img = document.createElement("img");
      img.src = thumb;
      el.appendChild(img);
    }

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = item?.title || "Untitled";
    el.appendChild(label);
  }

  function showPair() {
    pairStack.classList.remove("layer-back");
    pairStack.classList.add("layer-front");
    dressHanger.classList.remove("layer-front");
    dressHanger.classList.add("layer-back");
  }

  function showDress() {
    dressHanger.classList.remove("layer-back");
    dressHanger.classList.add("layer-front");
    pairStack.classList.remove("layer-front");
    pairStack.classList.add("layer-back");
  }

  document.getElementById("topBtn").addEventListener("click", () => {
    if (tops.length === 0) {
      statusLine.textContent = "No tops to show.";
      return;
    }

    topIndex = (topIndex + 1) % tops.length;
    fillHanger(topHanger, tops[topIndex]);

    showPair();
    statusLine.textContent = `Top ${topIndex + 1}/${tops.length}`;
  });

  document.getElementById("bottomBtn").addEventListener("click", () => {
    if (bottoms.length === 0) {
      statusLine.textContent = "No bottoms to show.";
      return;
    }

    bottomIndex = (bottomIndex + 1) % bottoms.length;
    fillHanger(bottomHanger, bottoms[bottomIndex]);

    showPair();
    statusLine.textContent = `Bottom ${bottomIndex + 1}/${bottoms.length}`;
  });

  document.getElementById("dressBtn").addEventListener("click", () => {
    if (dresses.length === 0) {
      statusLine.textContent = "No dresses to show.";
      return;
    }

    dressIndex = (dressIndex + 1) % dresses.length;
    fillHanger(dressHanger, dresses[dressIndex]);

    showDress();
    statusLine.textContent = `Dress ${dressIndex + 1}/${dresses.length}`;
  });

  loadItems();
</script>

</body>
</html>
