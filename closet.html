<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <a href="index.html" class="nav-btn">Home!</a>
  <title>What do we have today?</title>
  <!-- version 1 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Josefin Sans', sans-serif;
      background: #b7008c;
      color: #ffffff;
    }

    h1 {
      text-align: center;
      margin-top: 30px;
      font-size: 40px;
      color: #ffffff;
    }

    /* GRID */
    #galleryGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 25px;
      padding: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* CARD */
    .project-card {
      position: relative;
      background: white;
      border-radius: 12px;
      color:#b7008c;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      cursor: pointer;
      transition: transform 0.25s ease;
    }

    .project-card:hover {
      transform: scale(1.03);
    }

    /* THUMBNAIL */
    .project-thumb {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }

    /* TITLE */
    .project-info {
      padding: 12px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      background: #fff;
    }

    /* HOVER OVERLAY */
    .project-hover {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fe8e3d;
      color: white;
      opacity: 0;
      padding: 10px;
      transition: opacity 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: left;
      text-wrap: balance;
      font-size: 16px;
      line-height: 1.4;
    }

    .project-card:hover .project-hover {
      opacity: 1;
    }


      #filters {
    display: flex;
    gap: 15px;
    padding: 15px;
    background: #fe8e3d;
    border-radius: 10px;
    margin: 20px auto;
    width: fit-content;
    }

    #filters select {
    padding: 8px 12px;
    border-radius: 8px;
    background: #fe8e3d;
    color: white;
    border: 2px solid white;
    font-size: 16px;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    }


     .nav-btn {
      background: #fe8e3d;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      }

    .nav-btn:hover {
      background: #e6762d;
    }

    .top-nav {
  width: 100%;
  text-align: center;
  margin-bottom: 20px;
}

  </style>
</head>

<body>

  <h1>What do we have today?</h1>


  <div id="galleryGrid"></div>

  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
        getFirestore, collection, getDocs, query 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCdKB6yoYhJpN2cdSj29v_IKiYet88jOaY",
        authDomain: "gs-closet.firebaseapp.com",
        projectId: "gs-closet",
        storageBucket: "gs-closet.firebasestorage.app",
        messagingSenderId: "851094693820",
        appId: "1:851094693820:web:c33a7f98acbee0302fedb9",
        measurementId: "G-SE8P9F671F"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadGallery() {
        const gallery = document.getElementById("galleryGrid");

        try {
        const q = query(collection(db, "items"));
        const snapshot = await getDocs(q);
        const allProjects = [];

        snapshot.forEach(doc => {
            allProjects.push({ id: doc.id, ...doc.data() });
        });

        renderFiltered(allProjects);
        } catch (err) {
        console.error("Failed to load gallery:", err);
        gallery.innerHTML = "<p>Couldn't load items.</p>";
        }
    }

    function renderFiltered(items) {
        const gallery = document.getElementById("galleryGrid");
        gallery.innerHTML = "";

        items.forEach(data => {
        const thumb = data.photos?.[0] || "https://via.placeholder.com/300x200?text=No+Image";

        const card = document.createElement("div");
        card.className = "project-card";

        card.addEventListener("click", () => {
            window.location.href = `closet.html?id=${data.id}`;
        });

        card.innerHTML = `
            <img class="project-thumb" src="${thumb}">
            <div class="project-info">${data.title}</div>
            <div class="project-hover">
            <div><strong>Title:</strong> ${data.title || "N/A"}</div>
            <div><strong>Quality:</strong> ${data.quality || "N/A"}</div>
            <div><strong>Type:</strong> ${data.type || "N/A"}</div>
            <div><strong>Appropriateness:</strong> ${data.appropriateness || "N/A"}</div>
            <div><strong>Functionality:</strong> ${data.functionality || "N/A"}</div>
            </div>
        `;

        gallery.appendChild(card);
        });
  }

  loadGallery();
</script>


</body>
</html>
